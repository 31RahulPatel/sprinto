services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: compliance_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/compliance_platform?schema=public
      REDIS_URL: redis://redis:6379
      # Required — no insecure default. Generate with `openssl rand -hex 32` and put it in a
      # `.env` file next to this compose file (docker compose loads it automatically).
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in your .env file, e.g. output of openssl rand -hex 32}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your .env file, e.g. output of openssl rand -hex 32}"
      PORT: 4000
      # Defaults point at the bundled MinIO container. To point this deployment at a real AWS
      # S3 bucket instead, set S3_BUCKET/S3_REGION/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY in your
      # `.env`, and S3_ENDPOINT="" to unset it — no edits to this file needed.
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-compliance-evidence}
      # Optional — only needed once you connect a real cloud account / Bitbucket workspace.
      # Left blank by default rather than required, since not every deployment uses them.
      PLATFORM_AWS_ACCESS_KEY_ID: ${PLATFORM_AWS_ACCESS_KEY_ID:-}
      PLATFORM_AWS_SECRET_ACCESS_KEY: ${PLATFORM_AWS_SECRET_ACCESS_KEY:-}
      PLATFORM_AWS_PRINCIPAL_ARN: ${PLATFORM_AWS_PRINCIPAL_ARN:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      BITBUCKET_CALLBACK_URL: ${BITBUCKET_CALLBACK_URL:-http://localhost:3000/api/integrations/bitbucket/callback}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
